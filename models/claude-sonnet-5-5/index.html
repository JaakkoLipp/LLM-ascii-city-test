function decorateAlley(r) {
  const vertical = r.h > r.w;
  const L = vertical ? r.h : r.w;
  for (let y = r.y; y < r.y + r.h; y++) for (let x = r.x; x < r.x + r.w; x++) {

    const sideV = rng.chance(0.5) ? 0 : r.h - 1;
    const kind = rng.int(0, 2);
    if (vertical) {

      if (kind === 0) { if (isAirBox(x, y, 1, x + 1, y + 2, 2)) fillBox(x, y, 1, x + 1, y + 2, 2, M_DUMP); }
      else { if (isAirBox(x, y, 1, x + 1, y + 1, 3)) { setV(x, y, 1, M_CRATE); if (kind === 2) setV(x, y, 2, M_CRATE); } }
    } else {
      const y = r.y + (r.h > 1 ? sideV : 0), x = r.x + pos;
      if (kind === 0) { if (isAirBox(x, y, 1, x + 2, y + 1, 2)) fillBox(x, y, 1, x + 2, y + 1, 2, M_DUMP); }
      else { if (isAirBox(x, y, 1, x + 1, y + 1, 3)) { setV(x, y, 1, M_CRATE); if (kind === 2) setV(x, y, 2, M_CRATE); } }
    }

  const pos = Math.floor(L / 2) + rng.int(-2, 2);
  const mats = [M_NCYA, M_NMAG, M_NAMB];
  const ci = rng.int(0, 2);
  for (let t = 0; t < (vertical ? r.w : r.h); t++) {
    const x = vertical ? r.x + t : r.x + pos, y = vertical ? r.y + pos : r.y + t;

  const fx = vertical ? r.x + (r.w >> 1) : r.x + pos, fy = vertical ? r.y + pos : r.y + (r.h >> 1);
  if (getV(fx, fy, 5) === 0) setV(fx, fy, 5, mats[ci]);
  addLight(fx + 0.5, fy + 0.5, 4.6, NEON_PAL[[1, 0, 2][ci]], 2.4, 11, 0, 0.5, false);
}

function makePark(r) {
  const cx = r.x + (r.w >> 1), cy = r.y + (r.h >> 1);
  for (let y = r.y; y < r.y + r.h; y++) for (let x = r.x; x < r.x + r.w; x++) { tileKind[y * SX + x] = T_PARK; vox[y * SX + x] = M_GRASS; }
  for (let x = r.x; x < r.x + r.w; x++) putGround(x, cy, M_SIDEW);
  for (let y = r.y; y < r.y + r.h; y++) putGround(cx, y, M_SIDEW);
  const n = rng.int(4, 7);
  for (let k = 0; k < n; k++) {

    if (x === cx || y === cy || Math.abs(x - cx) + Math.abs(y - cy) < 4) continue;
    placeTree(x, y);
  }
  for (const b of [[cx + 1, cy + 2], [cx + 2, cy + 2], [cx - 2, cy - 3], [cx - 3, cy - 3]]) if (getV(b[0], b[1], 1) === 0) setV(b[0], b[1], 1, M_BENCH);
  const ox = cx + 2, oy = cy - 3;

    addLight(ox + 0.5, oy + 0.5, 4, [0.4, 0.9, 1.5], 2.6, 15, 0, 0.1, false);

}

function makeParking(r) {

/* ---------- buildings ---------- */
const SIGN_WORDS = ['BAR', '24H', 'HOTEL', 'RAMEN', 'SUSHI', 'CYBER', 'ARCADE', 'PHARMA', 'NOODLE', 'CLUB', 'TECH',
                    'NEON', 'DATA', 'MOTEL', 'GAMES', 'CAFE', 'BOOKS', 'VIDEO', 'LOTUS', 'OMEGA', 'SYNTH', 'CHROME',
                    'DELI', 'TAXI', 'CLINIC', 'PIZZA', 'SAKE', 'ROBOT', 'VR'];
function sideOpen(b, s) {
  let x, y;
  if (s === 0) { x = b.x + (b.w >> 1); y = b.y - 1; }
  else if (s === 1) { x = b.x + (b.w >> 1); y = b.y + b.h; }
  else if (s === 2) { x = b.x - 1; y = b.y + (b.h >> 1); }
  else { x = b.x + b.w; y = b.y + (b.h >> 1); }
  const k = tileKind[y * SX + x];
  return k === T_WALK || k === T_ALLEY || k === T_LOT || k === T_ROAD;
}
function tryFacadeSign(b, s, text, vertical, z0) {
  const d = signDims(text, vertical, false);
  const along = (s < 2) ? b.w : b.h;
  if (!vertical && d.W > along - 2) return false;
  let x0, y0, a;
  if (!vertical) {
    if (s < 2) { a = 1; x0 = b.x + rng.int(1, along - d.W - 1); y0 = s === 0 ? b.y - 1 : b.y + b.h; }
    else { a = 0; y0 = b.y + rng.int(1, along - d.W - 1); x0 = s === 2 ? b.x - 1 : b.x + b.w; }
  } else {
    if (s < 2) { a = 0; x0 = b.x + rng.int(1, along - 2); y0 = s === 0 ? b.y - d.W : b.y + b.h; }
    else { a = 1; y0 = b.y + rng.int(1, along - 2); x0 = s === 2 ? b.x - d.W : b.x + b.w; }
  }
  const off = [s === 2 ? -2 : (s === 3 ? 2 : 0), s === 0 ? -2 : (s === 1 ? 2 : 0)];
  if (vertical) { off[0] = s === 2 ? -1 : (s === 3 ? 1 : 0); off[1] = s === 0 ? -1 : (s === 1 ? 1 : 0); }
  return !!placeSign({ text, vertical, a, x0, y0, z0, lightOffset: off });
}
function facadeDetails(b) {

  for (const s of sides) {
    if (!sideOpen(b, s)) continue;
    if (nSigns < 2 && rng.chance(0.65)) {
      for (let tries = 0; tries < 4; tries++) {
        if (tryFacadeSign(b, s, rng.pick(SIGN_WORDS), false, 5 + rng.int(0, 1))) { nSigns++; break; }
      }
    }
    if (rng.chance(0.4)) {
      for (let tries = 0; tries < 3; tries++) {
        if (tryFacadeSign(b, s, rng.pick(['BAR', '24H', 'VR', 'HOTEL', 'CLUB', 'TAXI', 'SAKE']), true, 4 + rng.int(0, 2))) break;
      }
    }
  }

      const x = s < 2 ? b.x + t : (s === 2 ? b.x : b.x + b.w - 1);
      const y = s < 2 ? (s === 0 ? b.y : b.y + b.h - 1) : b.y + t;

    }
  }
  const nB = rng.int(0, 3);
  for (let k = 0; k < nB && b.f1 >= 3; k++) {
    const s = rng.int(0, 3);
    if (!sideOpen(b, s)) continue;
    const f = rng.int(1, b.f1 - 1), z = 1 + f * FLOOR_H;
    const t = rng.int(1, ((s < 2) ? b.w : b.h) - 4);
    let x0, y0, x1, y1;
    if (s < 2) { x0 = b.x + t; x1 = x0 + 3; y0 = s === 0 ? b.y - 1 : b.y + b.h; y1 = y0 + 1; }
    else { y0 = b.y + t; y1 = y0 + 3; x0 = s === 2 ? b.x - 1 : b.x + b.w; x1 = x0 + 1; }
    if (isAirBox(x0, y0, z, x1, y1, z + 1)) fillBox(x0, y0, z, x1, y1, z + 1, M_ROOF);
  }
  for (let k = 0; k < 4; k++) {
    const s = rng.int(0, 3);
    if (!sideOpen(b, s)) continue;
    const f = rng.int(1, Math.max(1, b.f1 - 1)), z = 2 + f * FLOOR_H;
    const t = rng.int(1, ((s < 2) ? b.w : b.h) - 2);
    const x = s < 2 ? b.x + t : (s === 2 ? b.x - 1 : b.x + b.w);
    const y = s < 2 ? (s === 0 ? b.y - 1 : b.y + b.h) : b.y + t;

}
function roofFeatures(b) {
  const r = b.roof, z = b.roofZ + 1;

    } else { if (isAirBox(x, y, z, x + 1, y + 1, z + 3)) fillBox(x, y, z, x + 1, y + 1, z + rng.int(2, 3), M_METAL); }
  }
}

function makeBuilding(fx, fy, fw, fh, opt) {
  opt = opt || {};
  if (buildings.length >= 250) return null;
  const id = buildings.length + 1;
  const style = opt.style !== undefined ? opt.style : rng.int(0, 3);
  const mat = [M_WCONC, M_WBRICK, M_WGLASS, M_WPANEL][style];
  const f1 = opt.floors || rng.int(2, 5);
  let f2 = 0;
  if (!opt.noTower && !opt.floors && rng.chance(0.55) && fw >= 8 && fh >= 8) f2 = rng.int(1, Math.min(4, 8 - f1));
  const b = { id, x: fx, y: fy, w: fw, h: fh, style, f1, f2 };
  buildings.push(b);
  bStyle[id] = style;
  bLit[id] = style === 2 ? rng.range(0.4, 0.8) : rng.range(0.2, 0.65);
  const tn = rng.range(0.85, 1.15);
  bTint[id * 3] = tn * rng.range(0.9, 1.1); bTint[id * 3 + 1] = tn * rng.range(0.9, 1.1); bTint[id * 3 + 2] = tn * rng.range(0.9, 1.1);
  const h1 = f1 * FLOOR_H;
  fillBox(fx, fy, 1, fx + fw, fy + fh, h1 + 1, mat);
  fillBox(fx, fy, h1, fx + fw, fy + fh, h1 + 1, M_ROOF);
  for (let y = fy; y < fy + fh; y++) for (let x = fx; x < fx + fw; x++) { tileKind[y * SX + x] = T_BLDG; tileBid[y * SX + x] = id; }
  b.roofZ = h1; b.roof = { x: fx, y: fy, w: fw, h: fh };
  if (f2 > 0) {
    let t = rng.int(2, 3);
    while (t > 1 && (fw - 2 * t < 4 || fh - 2 * t < 4)) t--;
    const tx = fx + t, ty = fy + t, tw = fw - 2 * t, th = fh - 2 * t;
    const h2 = h1 + f2 * FLOOR_H;
    fillBox(tx, ty, h1 + 1, tx + tw, ty + th, h2 + 1, mat);
    fillBox(tx, ty, h2, tx + tw, ty + th, h2 + 1, M_ROOF);
    b.roofZ = h2; b.roof = { x: tx, y: ty, w: tw, h: th };
  }
  if (!opt.noSigns) facadeDetails(b);
  roofFeatures(b);
  return b;
}

function addBillboards() {
  const cand = buildings.filter((b) => b.roof.w >= 10 && b.roofZ >= 12 && b.roofZ <= 28).sort((a, b) => b.roofZ - a.roofZ);
  let placed = 0;
  for (const b of cand) {

    const words = ['NEON', 'OMEGA', 'CHROME', 'LOTUS', 'SYNTH', 'GRID'];

    const d = signDims(text, false, true);

    if (d.W > r.w - 2) continue;
    const z = b.roofZ + 1;
    const x0 = r.x + ((r.w - d.W) >> 1), y0 = r.y + 1;
    if (!isAirBox(x0, y0, z, x0 + d.W, y0 + 1, z + 2 + d.H)) continue;

function bsp(r, depth, lots, alleys) {
  const minS = 8, gap = rng.int(2, 3);
  const canV = r.w >= 2 * minS + gap, canH = r.h >= 2 * minS + gap;
  if ((depth === 0 || (depth < 2 && rng.chance(0.5))) && (canV || canH)) {
    const vert = canV && (!canH || (r.w >= r.h ? rng.chance(0.75) : rng.chance(0.25)));
    if (vert) {
      const w1 = rng.int(minS, r.w - minS - gap);
      alleys.push({ x: r.x + w1, y: r.y, w: gap, h: r.h });
      bsp({ x: r.x, y: r.y, w: w1, h: r.h }, depth + 1, lots, alleys);
      bsp({ x: r.x + w1 + gap, y: r.y, w: r.w - w1 - gap, h: r.h }, depth + 1, lots, alleys);
    } else {
      const h1 = rng.int(minS, r.h - minS - gap);
      alleys.push({ x: r.x, y: r.y + h1, w: r.w, h: gap });
      bsp({ x: r.x, y: r.y, w: r.w, h: h1 }, depth + 1, lots, alleys);
      bsp({ x: r.x, y: r.y + h1 + gap, w: r.w, h: r.h - h1 - gap }, depth + 1, lots, alleys);
    }
  } else lots.push(r);
}
function buildLot(r, kind) {
  if (kind === 'park') return makePark(r);
  if (kind === 'lot') return makeParking(r);
  const ins = [rng.int(0, 1), rng.int(0, 1), rng.int(0, 1), rng.int(0, 1)];
  makeBuilding(r.x + ins[0], r.y + ins[2], r.w - ins[0] - ins[1], r.h - ins[2] - ins[3]);
}

/* ==========================================================================
   6. LIGHTS (flat arrays, bucketed on an 8 tile grid)
   ========================================================================== */
const NB = Math.ceil(SX / 8);
let LN = 0, LX, LY, LZ, LRr, LGg, LBb, LRAD2, LINV, LZONE, LSH, LFL, LI;
let bStart = new Int32Array(NB * NB + 1), bList = new Int16Array(1);

const MAXDL = 16;
const DLX = new Float32Array(MAXDL), DLY = new Float32Array(MAXDL), DLZ = new Float32Array(MAXDL);
const DLR = new Float32Array(MAXDL), DLG = new Float32Array(MAXDL), DLB = new Float32Array(MAXDL);
const DLRAD2 = new Float32Array(MAXDL), DLINV = new Float32Array(MAXDL);
let dlN = 0;
function buildLightGrid() {
  LN = lightsRaw.length;
  LX = new Float32Array(LN); LY = new Float32Array(LN); LZ = new Float32Array(LN);
  LRr = new Float32Array(LN); LGg = new Float32Array(LN); LBb = new Float32Array(LN);
  LRAD2 = new Float32Array(LN); LINV = new Float32Array(LN);
  LZONE = new Uint8Array(LN); LSH = new Uint8Array(LN); LFL = new Float32Array(LN); LI = new Float32Array(LN).fill(1);
  const counts = new Int32Array(NB * NB);
  for (let k = 0; k < LN; k++) {
    const L = lightsRaw[k];
    LX[k] = L.x; LY[k] = L.y; LZ[k] = L.z; LRr[k] = L.r; LGg[k] = L.g; LBb[k] = L.b;
    LRAD2[k] = L.rad * L.rad; LINV[k] = 1 / (L.rad * L.rad); LZONE[k] = L.zone; LSH[k] = L.shadow; LFL[k] = L.flick;
    const x0 = clamp(Math.floor((L.x - L.rad) / 8), 0, NB - 1), x1 = clamp(Math.floor((L.x + L.rad) / 8), 0, NB - 1);
    const y0 = clamp(Math.floor((L.y - L.rad) / 8), 0, NB - 1), y1 = clamp(Math.floor((L.y + L.rad) / 8), 0, NB - 1);
    for (let by = y0; by <= y1; by++) for (let bx = x0; bx <= x1; bx++) counts[by * NB + bx]++;
  }
  bStart = new Int32Array(NB * NB + 1);
  for (let i = 0; i < NB * NB; i++) bStart[i + 1] = bStart[i] + counts[i];
  bList = new Int16Array(bStart[NB * NB] + 1);
  const fillp = bStart.slice(0, NB * NB);
  for (let k = 0; k < LN; k++) {
    const L = lightsRaw[k];
    const x0 = clamp(Math.floor((L.x - L.rad) / 8), 0, NB - 1), x1 = clamp(Math.floor((L.x + L.rad) / 8), 0, NB - 1);
    const y0 = clamp(Math.floor((L.y - L.rad) / 8), 0, NB - 1), y1 = clamp(Math.floor((L.y + L.rad) / 8), 0, NB - 1);
    for (let by = y0; by <= y1; by++) for (let bx = x0; bx <= x1; bx++) bList[fillp[by * NB + bx]++] = k;

}
function bakeGroundLight() {
  GLR.fill(0); GLG.fill(0); GLB.fill(0);
  for (let y = PERIM; y < SY - PERIM; y++) for (let x = PERIM; x < SX - PERIM; x++) {
    const ti = y * SX + x;
    if (tileKind[ti] === T_BLDG || colTop[ti] > 2 || tileZone[ti] !== 0) continue;
    const px = x + 0.5, py = y + 0.5;
    const bi = (y >> 3) * NB + (x >> 3);
    let r = 0, g = 0, b = 0;
    for (let q = bStart[bi], qe = bStart[bi + 1]; q < qe; q++) {
      const k = bList[q];
      if (LSH[k] !== 1 || LZONE[k] !== 0) continue;
      const dx = LX[k] - px, dy = LY[k] - py, dz = LZ[k] - 1.0;
      const d2 = dx * dx + dy * dy + dz * dz;
      if (d2 >= LRAD2[k]) continue;
      const ndl = dz / (Math.sqrt(d2) + 1e-3);
      let att = 1 - d2 * LINV[k]; att *= att;
      const kk = att * ndl;

function flickerFactor(id, t, amt) {

  for (let k = 0; k < NEON_MATS.length; k++) neonF[NEON_MATS[k]] = flickerFactor(900 + k, TIME, 0.22);

/* ==========================================================================

const SIG_CYCLE = 26;

  if (t < 13) return 0; if (t < 23) return 2; if (t < 25) return 1; return 0;

function pedWindow(axis) {

/* ==========================================================================
   8. SURFACES (procedural materials) AND SHADING
   ========================================================================== */
const MOON_X = -0.545, MOON_Y = 0.650, MOON_Z = 0.530;
const SF = new Float64Array(8);   /* surface: SF[0] SF[1] SF[2] SF[3] SF[4] SF[5] gain */

function facade(m, ix, iy, iz, axis, u, v) {
  const bid = tileBid[iy * SX + ix];
  const nn = hash3(ix, iy, iz, 3);
  const k = 0.85 + 0.3 * nn;
  SF[0] *= bTint[bid * 3] * k; SF[1] *= bTint[bid * 3 + 1] * k; SF[2] *= bTint[bid * 3 + 2] * k;
  if (axis === 2) return;
  const f = ((iz - 1) / FLOOR_H) | 0, zl = (iz - 1) & 3;
  if (zl === 0 && v < 0.14) { SF[0] *= 0.6; SF[1] *= 0.6; SF[2] *= 0.6; }
  const style = bStyle[bid];
  const w = axis === 0 ? iy : ix;
  const vok = zl === 1 ? v > 0.22 : (zl === 2 ? v < 0.82 : false);
  let win = false;
  if (style === 0) { if ((w & 1) === 0 && vok && u > 0.12 && u < 0.88) win = true; }
  else if (style === 1) { const p = w % 3; if (p !== 2 && vok && (p === 0 ? u > 0.1 : u < 0.9)) win = true; }
  else if (style === 2) { if ((zl === 0 ? v > 0.25 : zl < 3) && u > 0.06 && u < 0.94) win = true; }
  else { if ((w % 3) === 1 && zl === 2 && u > 0.2 && u < 0.8 && v > 0.2 && v < 0.75) win = true; }
  if (!win) return;
  const h1 = hash3(w * 7 + axis, f * 3 + (zl >= 2 ? 1 : 0), bid, 11);
  let lit = h1 < bLit[bid];
  const h2 = hash3(w, f, bid, 12);
  if (h2 < 0.07) lit = hash3(w, f, ((TIME * 0.07 + h2 * 40) | 0), 13) < bLit[bid] + 0.1;
  if (lit) {
    const c = hash3(w, f, bid, 14);
    let cr, cg, cb;
    if (c < 0.62) { cr = 1.5; cg = 1.15; cb = 0.65; }
    else if (c < 0.84) { cr = 0.5; cg = 1.25; cb = 1.6; }
    else if (c < 0.94) { cr = 1.6; cg = 0.55; cb = 1.3; }
    else { cr = 0.7; cg = 1.6; cb = 0.8; }
    let br = 0.55 + 0.45 * hash3(w, f, bid, 15);
    if (hash3(w, f, bid, 16) < 0.06) br *= 0.65 + 0.35 * Math.sin(TIME * 11 + h1 * 50);
    SF[3] = cr * br; SF[4] = cg * br; SF[5] = cb * br;

}

function surface(m, ix, iy, iz, axis, sgn, hx, hy, hz, vidx) {
  let u, v;
  if (axis === 0) { u = hy - iy; v = hz - iz; } else if (axis === 1) { u = hx - ix; v = hz - iz; } else { u = hx - ix; v = hy - iy; }
  const mb = m * 3;
  SF[0] = matAlb[mb]; SF[1] = matAlb[mb + 1]; SF[2] = matAlb[mb + 2];
  SF[3] = matEmi[mb]; SF[4] = matEmi[mb + 1]; SF[5] = matEmi[mb + 2];
  SF[6] = 1;
  let k;
  switch (m) {
    case M_ASPHALT: {
      k = 0.7 + 0.6 * hash3(ix * 3 + ((u * 3) | 0), iy * 3 + ((v * 3) | 0), 5, SEED);
      SF[0] *= k; SF[1] *= k; SF[2] *= k;

    case M_SIDEW: case M_CURB: {
      k = (u < 0.06 || v < 0.06) ? 0.55 : (0.85 + 0.3 * hash3(ix, iy, 6, SEED));
      SF[0] *= k; SF[1] *= k; SF[2] *= k; SF[6] = 1.15;
      break;
    }
    case M_LINEY: case M_LINEW: {
      k = 0.7 + 0.3 * hash3(ix * 3 + ((u * 3) | 0), iy * 3 + ((v * 3) | 0), 7, SEED);
      SF[0] *= k; SF[1] *= k; SF[2] *= k; SF[6] = 1.3;

    case M_ROOF: {

    case M_TABLE: if (axis === 2) { SF[3] = 0.35; SF[4] = 0.2; SF[5] = 0.05; } break;

/* --- cheap 2.5D shadow test for street lamps --- */

}

function shade(px, py, pz, nx, ny, nz, dist, zone, gain) {

      const ry = Math.floor(y + TIME * sp + off);
      if (hash3(x, ry, 11, SEED) < 0.014) {
        const i = y * cols + x;
        if (cChar[i] < 12) { cChar[i] = 124 - 32; cR[i] = 90; cG[i] = 150; cB[i] = 190; cBg[i] = 0; }
      }
    }
  }
}

function renderScene() {
  computeCamera();
  updateLightFactors();
  updateDynamicLights();
  const cols = Rcols, rows = Rrows;
  for (let y = 0; y < rows; y++) {
    const rf = rowF[y];
    const bx = camFx + camUx * rf, by = camFy + camUy * rf, bz = camFz + camUz * rf;
    for (let x = 0; x < cols; x++) {
      const i = y * cols + x, cf = colF[x];
      traceCell(i, bx + camRx * cf, by + camRy * cf, bz, lenBuf[i]);
    }
  }
  entitiesPass();
  finalizeChars();
  if (rainOn) rainPass();
}

/* ==========================================================================
   13. HUD (drawn into the character grid)
   ========================================================================== */
function putText(x, y, s, r, g, b) {
  if (y < 0 || y >= Rrows) return;
  for (let k = 0; k < s.length; k++) {
    const xx = x + k;
    if (xx < 0 || xx >= Rcols) continue;
    const i = y * Rcols + xx;
    const c = s.charCodeAt(k);
    cChar[i] = (c >= 32 && c <= 126) ? c - 32 : 0;
    cR[i] = r; cG[i] = g; cB[i] = b; cBg[i] = 0;
  }
}
function clearRect(x0, y0, w, h) {
  for (let y = y0; y < y0 + h; y++) for (let x = x0; x < x0 + w; x++) {
    if (x < 0 || y < 0 || x >= Rcols || y >= Rrows) continue;
    const i = y * Rcols + x; cChar[i] = 0; cBg[i] = 0;
  }
}
function districtAt(x, y) {
  x = Math.floor(x); y = Math.floor(y);
  if (x < PERIM || y < PERIM || x >= SX - PERIM || y >= SY - PERIM) return 'PERIMETER WALL';
  const rx = roadIdx(x), ry = roadIdx(y);
  if (rx >= 0 && ry >= 0) return 'JUNCTION ' + String.fromCharCode(65 + rx) + (ry + 1);
  if (rx >= 0) return 'AVENUE ' + (rx + 1);
  if (ry >= 0) return 'STREET ' + (ry + 1);
  let bi = 0, bj = 0;
  for (let k = 0; k < 3; k++) { if (x >= BLOCK_O[k]) bi = k; if (y >= BLOCK_O[k]) bj = k; }
  return DISTRICTS[bj * 3 + bi];
}
function compass(yaw) {
  const deg = ((90 - yaw * 180 / Math.PI) % 360 + 360) % 360;
  const names = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
  return names[Math.round(deg / 45) % 8] + ' ' + Math.round(deg);
}
let fpsShown = 0, frameMsShown = 0;
function drawHud() {
  const G = [110, 255, 170], D = [70, 170, 120], Y = [255, 210, 90];
  const cols = Rcols, rows = Rrows;
  const l1 = ' FPS ' + fpsShown + '  POS ' + P.x.toFixed(1) + ' ' + P.y.toFixed(1) + ' ' + (1 + CFG.eye).toFixed(1) + '  HDG ' + compass(P.yaw) + ' ';
  const blockName = districtAt(P.x, P.y);
  const l2 = ' DISTRICT ' + blockName + ' ';
  const l3 = ' SEED ' + SEED + '  CREDITS ' + game.credits + ' ';
  clearRect(0, 0, l1.length, 1); clearRect(0, 1, l2.length, 1); clearRect(cols - l3.length, 0, l3.length, 1);
  putText(0, 0, l1, G[0], G[1], G[2]); putText(0, 1, l2, Y[0], Y[1], Y[2]); putText(cols - l3.length, 0, l3, D[0] + 40, D[1] + 40, D[2] + 40);
  const hint = ' WASD MOVE  SHIFT SPRINT  MOUSE LOOK  E USE  ESC UNLOCK  R RAIN  N NEW SEED  1-3 RES ';
  if (rows > 8) { clearRect(0, rows - 1, Math.min(cols, hint.length), 1); putText(0, rows - 1, hint.substring(0, cols), D[0], D[1], D[2]); }
  /* crosshair */
  const cx = cols >> 1, cy = rows >> 1;
  const ci = cy * cols + cx;
  cChar[ci] = 43 - 32; cR[ci] = 160; cG[ci] = 255; cB[ci] = 200; cBg[ci] = 0;
  /* prompt */
  if (game.cur) {
    const s = ' [E] ' + game.cur.label() + ' ';
    const x = Math.max(0, (cols - s.length) >> 1), y = Math.min(rows - 3, Math.floor(rows * 0.68));
    clearRect(x, y, s.length, 1); putText(x, y, s, 255, 240, 140);
  }
  /* message panel */
  if (game.msg && TIME < game.msgUntil) {
    let w = 0; for (const l of game.msg) w = Math.max(w, l.length);
    w += 4; const h = game.msg.length + 2;
    const x = Math.max(0, (cols - w) >> 1), y = Math.max(2, Math.floor(rows * 0.76) - (h >> 1));
    clearRect(x, y, w, h);
    const top = '+' + '-'.repeat(w - 2) + '+';
    putText(x, y, top, G[0], G[1], G[2]); putText(x, y + h - 1, top, G[0], G[1], G[2]);
    for (let k = 0; k < game.msg.length; k++) {
      putText(x, y + 1 + k, '|', G[0], G[1], G[2]); putText(x + w - 1, y + 1 + k, '|', G[0], G[1], G[2]);
      putText(x + 2, y + 1 + k, game.msg[k], 200, 255, 220);
    }
  }
}

/* ==========================================================================
   14. DISPLAY (glyph atlas and pixel blit to the canvas)
   ========================================================================== */
const Display = (function () {
  const canvas = document.getElementById('screen');
  const ctx = canvas.getContext('2d', { alpha: false });
  let W = 0, cw = 8, ch = 16, cols = 0, rows = 0, img = null, u32 = null, scale = 1;
  let gOff = [], gCov = [];
  function buildAtlas() {
    const off = document.createElement('canvas');
    off.width = cw; off.height = ch;
    const c2 = off.getContext('2d', { willReadFrequently: true });
    const fs = Math.round(ch * 0.84);
    c2.font = 'bold ' + fs + 'px "Cascadia Mono",Consolas,"DejaVu Sans Mono",Menlo,"Courier New",monospace';
    c2.textAlign = 'center'; c2.textBaseline = 'alphabetic';
    const base = Math.round(ch * 0.79);
    const Wp = cols * cw;
    gOff = new Array(95); gCov = new Array(95);
    gOff[0] = new Int32Array(0); gCov[0] = new Uint8Array(0);
    for (let g = 1; g < 95; g++) {
      c2.clearRect(0, 0, cw, ch);
      c2.fillStyle = '#fff';
      c2.fillText(String.fromCharCode(32 + g), cw / 2, base);
      const d = c2.getImageData(0, 0, cw, ch).data;
      let n = 0;
      for (let p = 0; p < cw * ch; p++) if (d[p * 4 + 3] > 12) n++;
      const o = new Int32Array(n), cv = new Uint8Array(n);
      let q = 0;
      for (let yy = 0; yy < ch; yy++) for (let xx = 0; xx < cw; xx++) {
        const a = d[(yy * cw + xx) * 4 + 3];
        if (a > 12) { o[q] = yy * Wp + xx; cv[q] = Math.min(255, Math.round(a * 1.15 + 6)); q++; }
      }
      gOff[g] = o; gCov[g] = cv;
    }
  }
  function layout() {
    const dpr = window.devicePixelRatio || 1;
    const cssW = window.innerWidth, cssH = window.innerHeight;
    scale = (dpr >= 1.5 && cssW * cssH * 4 <= 3.4e6) ? 2 : 1;
    W = cssW * scale;
    const Hh = cssH * scale;
    const target = CFG.colSteps[CFG.quality];
    cw = clamp(Math.round(W / target), 4, 20);
    ch = cw * 2;
    cols = Math.max(20, Math.floor(W / cw)); rows = Math.max(10, Math.floor(Hh / ch));
    canvas.width = cols * cw; canvas.height = rows * ch;
    canvas.style.width = (cols * cw / scale) + 'px'; canvas.style.height = (rows * ch / scale) + 'px';
    img = ctx.createImageData(canvas.width, canvas.height);
    u32 = new Uint32Array(img.data.buffer);
    buildAtlas();
    rendererResize(cols, rows, cw, ch);
  }
  function present() {
    u32.fill(0xFF000000);
    const Wp = canvas.width;
    for (let cy = 0; cy < rows; cy++) {
      for (let cx = 0; cx < cols; cx++) {
        const i = cy * cols + cx;
        const g = cChar[i], bgS = cBg[i];
        if (g === 0 && bgS === 0) continue;
        const R = cR[i], G = cG[i], B = cB[i];
        const base = cy * ch * Wp + cx * cw;
        let bR = 0, bG = 0, bB = 0;
        if (bgS) {
          bR = (R * bgS) >> 8; bG = (G * bgS) >> 8; bB = (B * bgS) >> 8;
          const bp = 0xFF000000 | (bB << 16) | (bG << 8) | bR;
          for (let yy = 0; yy < ch; yy++) { const o = base + yy * Wp; for (let xx = 0; xx < cw; xx++) u32[o + xx] = bp; }
        }
        if (g !== 0) {
          const offs = gOff[g], cov = gCov[g], n = offs.length;
          if (bgS) {
            for (let k = 0; k < n; k++) {
              const c = cov[k];
              u32[base + offs[k]] = 0xFF000000 | ((bB + (((B - bB) * c) >> 8)) << 16) | ((bG + (((G - bG) * c) >> 8)) << 8) | (bR + (((R - bR) * c) >> 8));
            }
          } else {
            for (let k = 0; k < n; k++) {
              const c = cov[k];
              u32[base + offs[k]] = 0xFF000000 | (((B * c) >> 8) << 16) | (((G * c) >> 8) << 8) | ((R * c) >> 8);
            }
          }
        }
      }
    }
    ctx.putImageData(img, 0, 0);
  }
  return { canvas, layout, present, get cols() { return cols; }, get rows() { return rows; } };
})();

/* ==========================================================================
   15. INPUT
   ========================================================================== */
let needLayout = false;
const overlay = document.getElementById('overlay');
function setOverlay(show) {
  if (show) {
    overlay.textContent = 'NEON GRID  //  ASCII CITY\n\nCLICK TO CAPTURE THE MOUSE\n\nWASD  move        SHIFT  sprint\nMOUSE  look       E  interact\nESC  release mouse\n\nNo pointer lock? Drag with the mouse\nor use the arrow keys to look.';
    overlay.className = '';
  } else overlay.className = 'hidden';
}
function requestLock() {
  try {
    const p = Display.canvas.requestPointerLock && Display.canvas.requestPointerLock();
    if (p && p.catch) p.catch(() => { lookFallback = true; });
  } catch (e) { lookFallback = true; }
}
function regenerate(seed) {
  generateCity(seed);
  spawnWorldEntities();
  P.x = world.spawn.x; P.y = world.spawn.y; P.yaw = world.spawn.yaw; P.pitch = 0; P.vx = P.vy = 0;
}
function onKeyDown(e) {
  if (e.repeat && e.code === 'KeyE') return;
  keys[e.code] = true;
  if (e.code === 'KeyE') { if (game.cur) game.cur.act(); }
  else if (e.code === 'KeyR') rainOn = !rainOn;
  else if (e.code === 'KeyN') { regenerate((Math.random() * 1e9) >>> 0); }
  else if (e.code === 'Digit1') { CFG.quality = 1; CFG.autoQuality = false; Display.layout(); }
  else if (e.code === 'Digit2') { CFG.quality = 3; CFG.autoQuality = false; Display.layout(); }
  else if (e.code === 'Digit3') { CFG.quality = 5; CFG.autoQuality = false; Display.layout(); }
  else if (e.code === 'Digit0') { CFG.autoQuality = true; }
  if (e.code.startsWith('Arrow') || e.code === 'Space') e.preventDefault();
}
function initInput() {
  window.addEventListener('keydown', onKeyDown);
  window.addEventListener('keyup', (e) => { keys[e.code] = false; });
  window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
  window.addEventListener('resize', () => { needLayout = true; });
  document.addEventListener('pointerlockchange', () => {
    pointerLocked = document.pointerLockElement === Display.canvas;
    setOverlay(!pointerLocked && !dragging);
  });
  document.addEventListener('pointerlockerror', () => { lookFallback = true; });
  Display.canvas.addEventListener('mousedown', (e) => {
    if (!pointerLocked) { requestLock(); dragging = true; setOverlay(false); }
  });
  window.addEventListener('mouseup', () => { dragging = false; });
  window.addEventListener('mousemove', (e) => {
    if (pointerLocked || dragging) {
      P.yaw -= (e.movementX || 0) * CFG.mouseSens;
      P.pitch = clamp(P.pitch - (e.movementY || 0) * CFG.mouseSens, -1.45, 1.45);
    }
  });
  document.addEventListener('contextmenu', (e) => e.preventDefault());
}

/* ==========================================================================
   16. GAME LOOP
   ========================================================================== */
function spawnWorldEntities() {
  ents.length = 0;
  rr = makeRng(SEED ^ 0x5bd1e995);
  spawnCars(); spawnPeds();
  npc = makePedEntity(99, [1.2, 0.3, 0.9]);
  npc.x = 64; npc.y = 66.5; npc.yaw = -Math.PI / 2; npc.zone = 1; npc.stride = 0; npc.phase = 0;
  animatePed(npc);
  for (const c of cars) ents.push(c);
  for (const p of peds) ents.push(p);
  ents.push(npc);
}
function update(dt) {
  TIME += dt;
  sigNS = signalState(1); sigEW = signalState(0);
  updatePlayer(dt);
  for (let n = 0; n < cars.length; n++) updateCar(cars[n], dt);
  for (let n = 0; n < peds.length; n++) updatePed(peds[n], dt);
  npc.yaw = -Math.PI / 2 + Math.sin(TIME * 0.7) * 0.25;
  updateInteraction();
}
function dumpFrame() {
  let s = '';
  for (let y = 0; y < Rrows; y++) { let line = ''; for (let x = 0; x < Rcols; x++) line += String.fromCharCode(32 + cChar[y * Rcols + x]); s += line + '\n'; }
  return s;
}

let lastT = 0, frames = 0, fpsT = 0, emaWork = 8, slowCount = 0, fastCount = 0;
function frame(now) {
  if (needLayout) { needLayout = false; Display.layout(); }
  const dt = Math.min(0.05, Math.max(0.0001, (now - lastT) / 1000));
  lastT = now;
  const w0 = performance.now();
  update(dt);
  renderScene();
  drawHud();
  Display.present();
  const work = performance.now() - w0;
  emaWork += (work - emaWork) * 0.1;
  frames++; fpsT += dt;
  if (fpsT >= 0.5) { fpsShown = Math.round(frames / fpsT); frames = 0; fpsT = 0; }
  if (CFG.autoQuality) {
    if (emaWork > 13.5) { slowCount++; fastCount = 0; } else if (emaWork < 6.5) { fastCount++; slowCount = 0; } else { slowCount = 0; fastCount = 0; }
    if (slowCount > 40 && CFG.quality > 0) { CFG.quality--; slowCount = 0; emaWork = 9; Display.layout(); }
    else if (fastCount > 240 && CFG.quality < 4) { CFG.quality++; fastCount = 0; emaWork = 9; Display.layout(); }
  }
  requestAnimationFrame(frame);
}

function boot() {
  SEED = parseSeedFromUrl();
  Display.layout();
  regenerate(SEED);
  initInput();
  setOverlay(true);
  window.__ASCII_CITY = {
    CFG, P, ents, cars, peds, game, world, interactables, buildings, vox, blocked, tileKind,
    update, render: renderScene, hud: drawHud, dump: dumpFrame, regenerate, layout: Display.layout,
    present: Display.present, keys, castRay, districtAt,
    lastHit: function () { return { t: HR[0], m: hM, axis: hAxis, ix: hIx, iy: hIy, iz: hIz }; },
    exportFrame: function () { return { raw: Array.from(bufR).map((v, i) => Math.max(v, bufG[i], bufB[i])), depth: Array.from(depthT), cols: Rcols, rows: Rrows, ch: Array.from(cChar), r: Array.from(cR), g: Array.from(cG), b: Array.from(cB), bg: Array.from(cBg) }; },
    get cols() { return Rcols; }, get rows() { return Rrows; }, get time() { return TIME; }, get lights() { return LN; }
  };
  lastT = performance.now();
  requestAnimationFrame(frame);
}
boot();
})();
</script>
